name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: ${{ matrix.family }} build and retained tests
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone, iPad]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show existing toolchain and reject local credential files
        run: |
          xcodebuild -version
          test ! -e DeveloperSettings.xcconfig
          test ! -e Secrets.xcconfig
          test ! -e NEOs/Secrets.xcconfig
      - name: Select an installed simulator
        id: simulator
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          python3 -I - <<'PYCODE'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))["devices"]
          choices = [(runtime, item["name"], item["udid"]) for runtime, items in devices.items()
                     if ".iOS-" in runtime for item in items
                     if item.get("isAvailable") and item["name"].startswith(os.environ["FAMILY"])]
          if not choices:
              raise SystemExit("No installed compatible simulator")
          _, name, udid = sorted(choices)[-1]
          print("Using installed simulator:", name, udid)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("udid=" + udid + "\n")
          PYCODE
      - name: Compile unsigned Release
        if: matrix.family == 'iPhone'
        run: |
          set -euo pipefail
          xcodebuild -project NEOs.xcodeproj -scheme NEOs -configuration Release \
            -destination 'generic/platform=iOS Simulator' -jobs 2 \
            -derivedDataPath "$RUNNER_TEMP/Release" CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= build 2>&1 | tee "$RUNNER_TEMP/release.log"
      - name: Run every retained unit and UI test
        run: |
          set -euo pipefail
          xcodebuild -project NEOs.xcodeproj -scheme NEOs -configuration Debug \
            -destination 'id=${{ steps.simulator.outputs.udid }}' -parallel-testing-enabled NO -jobs 2 \
            -testLanguage en -testRegion US -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= test 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: Verify tracked source was preserved
        run: git diff --quiet --exit-code
      - name: Retain failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: failure-${{ matrix.family }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release.log
            ${{ runner.temp }}/tests.log
            ${{ runner.temp }}/tests.xcresult
          retention-days: 3
